<svg xmlns="http://www.w3.org/2000/svg" width="700" height="760" viewBox="0 0 700 760" role="img">
<title>最高优先数循环轮转流程图</title>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#466784"/></marker></defs>
<rect width="700" height="760" fill="#fff"/>
<g font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="16" fill="#18354b">
<path d="M195 74 V108" fill="none" stroke="#466784" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M300 141 H410" fill="none" stroke="#466784" stroke-width="2" marker-end="url(#arrow)"/>
<text x="350" y="131" font-size="14">是</text>
<path d="M195 174 V218" fill="none" stroke="#466784" stroke-width="2" marker-end="url(#arrow)"/>
<text x="207" y="197" font-size="14">否</text>
<path d="M195 264 V304" fill="none" stroke="#466784" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M300 337 H410" fill="none" stroke="#466784" stroke-width="2" marker-end="url(#arrow)"/>
<text x="350" y="327" font-size="14">是</text>
<path d="M195 370 V418" fill="none" stroke="#466784" stroke-width="2" marker-end="url(#arrow)"/>
<text x="207" y="398" font-size="14">否</text>
<path d="M195 476 V515" fill="none" stroke="#466784" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M195 573 V614" fill="none" stroke="#466784" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M530 370 V393 H375 V242 H345" fill="none" stroke="#466784" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M195 686 V716 H20 V95 H195 V108" fill="none" stroke="#466784" stroke-width="2" marker-end="url(#arrow)"/>
<text x="35" y="708" font-size="14">下一次选择</text>
<rect x="45" y="28" width="300" height="46" rx="22" fill="#edf4fa" stroke="#466784" stroke-width="2"/>
<text x="195.0" y="57.0" text-anchor="middle">开始：复制原始输入，t = 0</text>
<polygon points="195.0,108 300,141.0 195.0,174 90,141.0" fill="#edf4fa" stroke="#466784" stroke-width="2"/>
<text x="195.0" y="147.0" text-anchor="middle">全部进程完成？</text>
<rect x="45" y="218" width="300" height="46" rx="7" fill="#edf4fa" stroke="#466784" stroke-width="2"/>
<text x="195.0" y="247.0" text-anchor="middle">更新就绪集合</text>
<polygon points="195.0,304 300,337.0 195.0,370 90,337.0" fill="#edf4fa" stroke="#466784" stroke-width="2"/>
<text x="195.0" y="343.0" text-anchor="middle">就绪集合为空？</text>
<rect x="45" y="418" width="300" height="58" rx="7" fill="#edf4fa" stroke="#466784" stroke-width="2"/>
<text x="195.0" y="441.5" text-anchor="middle">选择最高优先数</text>
<text x="195.0" y="464.5" text-anchor="middle">相同优先数按入队顺序</text>
<rect x="45" y="515" width="300" height="58" rx="7" fill="#edf4fa" stroke="#466784" stroke-width="2"/>
<text x="195.0" y="538.5" text-anchor="middle">运行 min(时间片, 剩余时间)</text>
<text x="195.0" y="561.5" text-anchor="middle">推进时间，加入新到达进程</text>
<rect x="45" y="614" width="300" height="72" rx="7" fill="#edf4fa" stroke="#466784" stroke-width="2"/>
<text x="195.0" y="644.5" text-anchor="middle">完成：记录时间、标记 F</text>
<text x="195.0" y="667.5" text-anchor="middle">未完成：优先数减 1，重新入队</text>
<rect x="410" y="308" width="240" height="62" rx="7" fill="#edf4fa" stroke="#466784" stroke-width="2"/>
<text x="530.0" y="345.0" text-anchor="middle">记录 IDLE，跳到下次到达</text>
<rect x="410" y="110" width="240" height="62" rx="22" fill="#edf4fa" stroke="#466784" stroke-width="2"/>
<text x="530.0" y="147.0" text-anchor="middle">输出统计结果，结束</text>
</g></svg>