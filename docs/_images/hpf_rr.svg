<svg xmlns="http://www.w3.org/2000/svg" width="900" height="580" viewBox="0 0 900 580" role="img" aria-labelledby="title desc">
<title id="title">优先数 + 时间片 · 示例规则</title>
<desc id="desc">时间片 = 2；优先数越大越优先，同优先数按入队顺序 运行片段：P1 → P2 → P3 → P1 → P4 → P2 → P4 → P2。</desc>
<rect x="0" y="0" width="900" height="580" rx="0" fill="#f8fafc" stroke="#f8fafc" stroke-width="1.5"/>
<rect x="18" y="18" width="864" height="544" rx="18" fill="#ffffff" stroke="#d7e3ef" stroke-width="1.5"/>
<g font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif">
<text x="42" y="56" font-size="27" fill="#0f2740" font-weight="700" text-anchor="start">优先数 + 时间片 · 示例规则</text>
<text x="42" y="82" font-size="15" fill="#52677b" font-weight="400" text-anchor="start">时间片 = 2；优先数越大越优先，同优先数按入队顺序</text>
<rect x="42" y="103" width="194" height="62" rx="10" fill="#f9fbfd" stroke="#d8e2ec" stroke-width="1.5"/>
<rect x="42" y="103" width="6" height="62" rx="3" fill="#2563eb"/>
<text x="58" y="129" font-size="19" fill="#2563eb" font-weight="700" text-anchor="start">P1</text>
<text x="100" y="127" font-size="15" fill="#244158" font-weight="400" text-anchor="start">到达 0 · 运行 3</text>
<text x="100" y="150" font-size="14" fill="#52677b" font-weight="400" text-anchor="start">初始优先数 4</text>
<rect x="246" y="103" width="194" height="62" rx="10" fill="#f9fbfd" stroke="#d8e2ec" stroke-width="1.5"/>
<rect x="246" y="103" width="6" height="62" rx="3" fill="#b45309"/>
<text x="262" y="129" font-size="19" fill="#b45309" font-weight="700" text-anchor="start">P2</text>
<text x="304" y="127" font-size="15" fill="#244158" font-weight="400" text-anchor="start">到达 1 · 运行 6</text>
<text x="304" y="150" font-size="14" fill="#52677b" font-weight="400" text-anchor="start">初始优先数 3</text>
<rect x="450" y="103" width="194" height="62" rx="10" fill="#f9fbfd" stroke="#d8e2ec" stroke-width="1.5"/>
<rect x="450" y="103" width="6" height="62" rx="3" fill="#059669"/>
<text x="466" y="129" font-size="19" fill="#059669" font-weight="700" text-anchor="start">P3</text>
<text x="508" y="127" font-size="15" fill="#244158" font-weight="400" text-anchor="start">到达 2 · 运行 2</text>
<text x="508" y="150" font-size="14" fill="#52677b" font-weight="400" text-anchor="start">初始优先数 3</text>
<rect x="654" y="103" width="194" height="62" rx="10" fill="#f9fbfd" stroke="#d8e2ec" stroke-width="1.5"/>
<rect x="654" y="103" width="6" height="62" rx="3" fill="#7c3aed"/>
<text x="670" y="129" font-size="19" fill="#7c3aed" font-weight="700" text-anchor="start">P4</text>
<text x="712" y="127" font-size="15" fill="#244158" font-weight="400" text-anchor="start">到达 3 · 运行 3</text>
<text x="712" y="150" font-size="14" fill="#52677b" font-weight="400" text-anchor="start">初始优先数 2</text>
<rect x="42" y="183" width="816" height="70" rx="12" fill="#f4f8fc" stroke="#cddbea" stroke-width="1.5"/>
<rect x="56" y="198" width="67" height="40" rx="9" fill="#dceafa" stroke="#bed2e7" stroke-width="1.5"/>
<text x="89.5" y="224" font-size="17" fill="#185084" font-weight="700" text-anchor="middle">t=2</text>
<text x="140" y="212" font-size="17" fill="#18354b" font-weight="700" text-anchor="start">P1 运行 2，剩余 1；优先数 4 → 3</text>
<text x="140" y="237" font-size="15" fill="#52677b" font-weight="400" text-anchor="start">P2 已在 t=1 入队，和 P1 同为 3；选更早入队的 P2</text>
<rect x="42" y="265" width="816" height="70" rx="12" fill="#f4f8fc" stroke="#cddbea" stroke-width="1.5"/>
<rect x="56" y="280" width="67" height="40" rx="9" fill="#dceafa" stroke="#bed2e7" stroke-width="1.5"/>
<text x="89.5" y="306" font-size="17" fill="#185084" font-weight="700" text-anchor="middle">t=4</text>
<text x="140" y="294" font-size="17" fill="#18354b" font-weight="700" text-anchor="start">P2 运行 2，剩余 4；优先数 3 → 2</text>
<text x="140" y="319" font-size="15" fill="#52677b" font-weight="400" text-anchor="start">P3 和 P1 同为 3；P3 更早入队，下一段选 P3</text>
<text x="42" y="378" font-size="19" fill="#173c5c" font-weight="700" text-anchor="start">CPU 运行时间轴</text>
<text x="858" y="378" font-size="14" fill="#52677b" font-weight="400" text-anchor="end">时间 →</text>
<rect x="70" y="398" width="108" height="54" fill="#2563eb" stroke="#ffffff" stroke-width="3" rx="4"/>
<text x="124" y="433" font-size="19" fill="#ffffff" font-weight="700" text-anchor="middle">P1</text>
<rect x="178" y="398" width="108" height="54" fill="#b45309" stroke="#ffffff" stroke-width="3" rx="4"/>
<text x="232" y="433" font-size="19" fill="#ffffff" font-weight="700" text-anchor="middle">P2</text>
<rect x="286" y="398" width="108" height="54" fill="#059669" stroke="#ffffff" stroke-width="3" rx="4"/>
<text x="340" y="433" font-size="19" fill="#ffffff" font-weight="700" text-anchor="middle">P3</text>
<rect x="394" y="398" width="54" height="54" fill="#2563eb" stroke="#ffffff" stroke-width="3" rx="4"/>
<text x="421" y="433" font-size="19" fill="#ffffff" font-weight="700" text-anchor="middle">P1</text>
<rect x="448" y="398" width="108" height="54" fill="#7c3aed" stroke="#ffffff" stroke-width="3" rx="4"/>
<text x="502" y="433" font-size="19" fill="#ffffff" font-weight="700" text-anchor="middle">P4</text>
<rect x="556" y="398" width="108" height="54" fill="#b45309" stroke="#ffffff" stroke-width="3" rx="4"/>
<text x="610" y="433" font-size="19" fill="#ffffff" font-weight="700" text-anchor="middle">P2</text>
<rect x="664" y="398" width="54" height="54" fill="#7c3aed" stroke="#ffffff" stroke-width="3" rx="4"/>
<text x="691" y="433" font-size="19" fill="#ffffff" font-weight="700" text-anchor="middle">P4</text>
<rect x="718" y="398" width="108" height="54" fill="#b45309" stroke="#ffffff" stroke-width="3" rx="4"/>
<text x="772" y="433" font-size="19" fill="#ffffff" font-weight="700" text-anchor="middle">P2</text>
<line x1="70" y1="454" x2="70" y2="462" stroke="#64748b" stroke-width="1.5"/>
<text x="70" y="481" font-size="14" fill="#475569" font-weight="500" text-anchor="middle">0</text>
<line x1="178" y1="454" x2="178" y2="462" stroke="#64748b" stroke-width="1.5"/>
<text x="178" y="481" font-size="14" fill="#475569" font-weight="500" text-anchor="middle">2</text>
<line x1="286" y1="454" x2="286" y2="462" stroke="#64748b" stroke-width="1.5"/>
<text x="286" y="481" font-size="14" fill="#475569" font-weight="500" text-anchor="middle">4</text>
<line x1="394" y1="454" x2="394" y2="462" stroke="#64748b" stroke-width="1.5"/>
<text x="394" y="481" font-size="14" fill="#475569" font-weight="500" text-anchor="middle">6</text>
<line x1="448" y1="454" x2="448" y2="462" stroke="#64748b" stroke-width="1.5"/>
<text x="448" y="481" font-size="14" fill="#475569" font-weight="500" text-anchor="middle">7</text>
<line x1="556" y1="454" x2="556" y2="462" stroke="#64748b" stroke-width="1.5"/>
<text x="556" y="481" font-size="14" fill="#475569" font-weight="500" text-anchor="middle">9</text>
<line x1="664" y1="454" x2="664" y2="462" stroke="#64748b" stroke-width="1.5"/>
<text x="664" y="481" font-size="14" fill="#475569" font-weight="500" text-anchor="middle">11</text>
<line x1="718" y1="454" x2="718" y2="462" stroke="#64748b" stroke-width="1.5"/>
<text x="718" y="481" font-size="14" fill="#475569" font-weight="500" text-anchor="middle">12</text>
<line x1="826" y1="454" x2="826" y2="462" stroke="#64748b" stroke-width="1.5"/>
<text x="826" y="481" font-size="14" fill="#475569" font-weight="500" text-anchor="middle">14</text>
<rect x="42" y="505" width="816" height="46" rx="10" fill="#eaf4ff" stroke="#c5ddf5" stroke-width="1.5"/>
<text x="58" y="534" font-size="16" fill="#16446e" font-weight="600" text-anchor="start">运行片段：P1 → P2 → P3 → P1 → P4 → P2 → P4 → P2。</text>
</g></svg>
