<svg xmlns="http://www.w3.org/2000/svg" width="900" height="580" viewBox="0 0 900 580" role="img" aria-labelledby="title desc">
<title id="title">SJF · 最短作业优先</title>
<desc id="desc">规则：只在已到达的进程中选择运行时间最短者；非抢占 顺序：P1 → P3 → P4 → P2；已开始的 P1 不会被新到达进程抢占。</desc>
<rect x="0" y="0" width="900" height="580" rx="0" fill="#f8fafc" stroke="#f8fafc" stroke-width="1.5"/>
<rect x="18" y="18" width="864" height="544" rx="18" fill="#ffffff" stroke="#d7e3ef" stroke-width="1.5"/>
<g font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif">
<text x="42" y="56" font-size="27" fill="#0f2740" font-weight="700" text-anchor="start">SJF · 最短作业优先</text>
<text x="42" y="82" font-size="15" fill="#52677b" font-weight="400" text-anchor="start">规则：只在已到达的进程中选择运行时间最短者；非抢占</text>
<rect x="42" y="103" width="194" height="62" rx="10" fill="#f9fbfd" stroke="#d8e2ec" stroke-width="1.5"/>
<rect x="42" y="103" width="6" height="62" rx="3" fill="#2563eb"/>
<text x="58" y="129" font-size="19" fill="#2563eb" font-weight="700" text-anchor="start">P1</text>
<text x="100" y="127" font-size="15" fill="#244158" font-weight="400" text-anchor="start">到达 0 · 运行 3</text>
<text x="58" y="151" font-size="13" fill="#6a7e91" font-weight="400" text-anchor="start">单 CPU · 已到达才可选择</text>
<rect x="246" y="103" width="194" height="62" rx="10" fill="#f9fbfd" stroke="#d8e2ec" stroke-width="1.5"/>
<rect x="246" y="103" width="6" height="62" rx="3" fill="#b45309"/>
<text x="262" y="129" font-size="19" fill="#b45309" font-weight="700" text-anchor="start">P2</text>
<text x="304" y="127" font-size="15" fill="#244158" font-weight="400" text-anchor="start">到达 1 · 运行 6</text>
<text x="262" y="151" font-size="13" fill="#6a7e91" font-weight="400" text-anchor="start">单 CPU · 已到达才可选择</text>
<rect x="450" y="103" width="194" height="62" rx="10" fill="#f9fbfd" stroke="#d8e2ec" stroke-width="1.5"/>
<rect x="450" y="103" width="6" height="62" rx="3" fill="#059669"/>
<text x="466" y="129" font-size="19" fill="#059669" font-weight="700" text-anchor="start">P3</text>
<text x="508" y="127" font-size="15" fill="#244158" font-weight="400" text-anchor="start">到达 2 · 运行 2</text>
<text x="466" y="151" font-size="13" fill="#6a7e91" font-weight="400" text-anchor="start">单 CPU · 已到达才可选择</text>
<rect x="654" y="103" width="194" height="62" rx="10" fill="#f9fbfd" stroke="#d8e2ec" stroke-width="1.5"/>
<rect x="654" y="103" width="6" height="62" rx="3" fill="#7c3aed"/>
<text x="670" y="129" font-size="19" fill="#7c3aed" font-weight="700" text-anchor="start">P4</text>
<text x="712" y="127" font-size="15" fill="#244158" font-weight="400" text-anchor="start">到达 3 · 运行 3</text>
<text x="670" y="151" font-size="13" fill="#6a7e91" font-weight="400" text-anchor="start">单 CPU · 已到达才可选择</text>
<rect x="42" y="183" width="816" height="70" rx="12" fill="#f4f8fc" stroke="#cddbea" stroke-width="1.5"/>
<rect x="56" y="198" width="67" height="40" rx="9" fill="#dceafa" stroke="#bed2e7" stroke-width="1.5"/>
<text x="89.5" y="224" font-size="17" fill="#185084" font-weight="700" text-anchor="middle">t=0</text>
<text x="140" y="212" font-size="17" fill="#18354b" font-weight="700" text-anchor="start">只有 P1 已到达</text>
<text x="140" y="237" font-size="15" fill="#52677b" font-weight="400" text-anchor="start">P3 虽然更短，但要到 t=2 才到，不能提前选择</text>
<rect x="42" y="265" width="816" height="70" rx="12" fill="#f4f8fc" stroke="#cddbea" stroke-width="1.5"/>
<rect x="56" y="280" width="67" height="40" rx="9" fill="#dceafa" stroke="#bed2e7" stroke-width="1.5"/>
<text x="89.5" y="306" font-size="17" fill="#185084" font-weight="700" text-anchor="middle">t=3</text>
<text x="140" y="294" font-size="17" fill="#18354b" font-weight="700" text-anchor="start">就绪：P2 需 6，P3 需 2，P4 需 3</text>
<text x="140" y="319" font-size="15" fill="#52677b" font-weight="400" text-anchor="start">选 P3；t=5 再比较 P2 与 P4，选较短的 P4</text>
<text x="42" y="378" font-size="19" fill="#173c5c" font-weight="700" text-anchor="start">CPU 运行时间轴</text>
<text x="858" y="378" font-size="14" fill="#52677b" font-weight="400" text-anchor="end">时间 →</text>
<rect x="70" y="398" width="162" height="54" fill="#2563eb" stroke="#ffffff" stroke-width="3" rx="4"/>
<text x="151" y="433" font-size="19" fill="#ffffff" font-weight="700" text-anchor="middle">P1</text>
<rect x="232" y="398" width="108" height="54" fill="#059669" stroke="#ffffff" stroke-width="3" rx="4"/>
<text x="286" y="433" font-size="19" fill="#ffffff" font-weight="700" text-anchor="middle">P3</text>
<rect x="340" y="398" width="162" height="54" fill="#7c3aed" stroke="#ffffff" stroke-width="3" rx="4"/>
<text x="421" y="433" font-size="19" fill="#ffffff" font-weight="700" text-anchor="middle">P4</text>
<rect x="502" y="398" width="324" height="54" fill="#b45309" stroke="#ffffff" stroke-width="3" rx="4"/>
<text x="664" y="433" font-size="19" fill="#ffffff" font-weight="700" text-anchor="middle">P2</text>
<line x1="70" y1="454" x2="70" y2="462" stroke="#64748b" stroke-width="1.5"/>
<text x="70" y="481" font-size="14" fill="#475569" font-weight="500" text-anchor="middle">0</text>
<line x1="232" y1="454" x2="232" y2="462" stroke="#64748b" stroke-width="1.5"/>
<text x="232" y="481" font-size="14" fill="#475569" font-weight="500" text-anchor="middle">3</text>
<line x1="340" y1="454" x2="340" y2="462" stroke="#64748b" stroke-width="1.5"/>
<text x="340" y="481" font-size="14" fill="#475569" font-weight="500" text-anchor="middle">5</text>
<line x1="502" y1="454" x2="502" y2="462" stroke="#64748b" stroke-width="1.5"/>
<text x="502" y="481" font-size="14" fill="#475569" font-weight="500" text-anchor="middle">8</text>
<line x1="826" y1="454" x2="826" y2="462" stroke="#64748b" stroke-width="1.5"/>
<text x="826" y="481" font-size="14" fill="#475569" font-weight="500" text-anchor="middle">14</text>
<rect x="42" y="505" width="816" height="46" rx="10" fill="#eaf4ff" stroke="#c5ddf5" stroke-width="1.5"/>
<text x="58" y="534" font-size="16" fill="#16446e" font-weight="600" text-anchor="start">顺序：P1 → P3 → P4 → P2；已开始的 P1 不会被新到达进程抢占。</text>
</g></svg>
